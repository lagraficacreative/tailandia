server {
  listen 80;
  server_name _;
  root  /usr/share/nginx/html;
  index index.html;

  # Que ningún buscador la indexe
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # ---------------------------------------------------------------
  # CONTRASEÑA (opcional)
  # Descomenta estas dos líneas para que pida usuario y contraseña.
  # Antes hay que crear el archivo .htpasswd con:
  #     htpasswd -c .htpasswd tailandia
  # (en Mac: brew install httpd. O en https://hostingcanada.org/htpasswd-generator/)
  # ---------------------------------------------------------------
  # auth_basic           "Thailand Trip Hub";
  # auth_basic_user_file /etc/nginx/.htpasswd;

  # El service worker no se debe cachear, si no los cambios tardan en verse
  location = /sw.js {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /manifest.webmanifest {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache";
    types { } default_type "application/manifest+json";
  }

  # Archivos con nombre fijo: caché corta para que las actualizaciones lleguen
  location ~* \.(js|css)$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "public, max-age=3600";
  }

  location ~* \.(png|jpg|jpeg|svg|webp|woff2)$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "public, max-age=604800";
  }

  # Todo lo demás va al index (la navegación es interna, con #)
  location / {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
